<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Watchlist</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Crypto Watchlist</h1>
  <p id="status-message"></p>
   <!--search bar -->
    <form id="search-form" class="search-container">
        <input type="text" id="search-input" placeholder="Search by coin name (e.g., Bitcoin)" 
         autocomplete="off">
        <button type="submit" id="search-button">Search</button>
    </form>
    <table>
     <thead>
         <tr>
             <th>Rank</th>
              <th>Name</th>
              <th>Price (USD)</th>
             <th>24h Change</th>
         </tr>
     </thead>
     <tbody id="coin-table-body"></tbody>
    </table>

   <script src="js/main.js" type="module"></script>
</body>
</html>
